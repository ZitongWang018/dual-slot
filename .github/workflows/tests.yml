name: Tests
on: [push, pull_request]
jobs:
  recurrence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/test_dual_slot_native.py
      - name: Check launch scripts
        run: |
          for script in scripts/*.sh scripts/*.sbatch scripts/toolchain/python3-config; do
            bash -n "$script"
          done
